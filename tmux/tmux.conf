source-file ~/.config/tmux/keybinds.conf

# settings
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g status-position top
set -g status-style "bg=default,fg=default"

# statusline modules
	# left
	set -g status-left " #S "
	set -g status-left-length 50
	
	# center
	set -g status-justify centre
	setw -g window-status-format "#I.#W "
	setw -g window-status-current-format " #I.#W "

	# right
	set -g status-right "󰸗 %a %d %b | 󱑁 %-I:%M %p "
	set -g status-right-length 50

# highlights
	# active windows
	setw -g window-status-current-style "fg=#e08060,bold"
	setw -g window-status-style "fg=default"

	# active splits
	set -g pane-active-border-style "fg=#e08060"
	set -g pane-border-style "fg=default"

# layout presets
	# hsplit
	bind F1 split-window -v \; select-layout 'a619,186x37,0,0[186x28,0,0,0,186x8,0,29,1]'

	# hsplit + ref-pane
	bind F2 split-window -v \; split-window -h \; select-layout 'e4b7,186x37,0,0[186x28,0,0{113x28,0,0,0,72x28,114,0,2},186x8,0,29,1]'
